colorScheme = "slate"
defaultAppearance = "light"
autoSwitchAppearance = true
enableSearch = false
enableCodeCopy = false
enableImageLazyLoading = true
enableImageWebp = true

[header]
  layout = "basic"
  showTitle = true

[footer]
  showCopyright = true
  showThemeAttribution = false
  showScrollToTop = true

[homepage]
  layout = "custom"
  showRecent = false

[substackFeed]
  url = "https://sarkas.tech/feed"
  limit = 3

[article]
  showDate = true
  showAuthor = false
  showReadingTime = false
  showTableOfContents = false
  showHeadingAnchors = false
  showPagination = true
  sharingLinks = []

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Public Authority Assessment Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="wrap" aria-label="Public Authority Assessment Dashboard">
      <header class="topbar">
        <div class="head-left">
          <p class="eyebrow">EIC working dataset</p>
          <h1>Public Authority Assessment Dashboard</h1>
          <p class="subtitle" id="subtitle">Which organisations count as public authorities, and how their codes of conduct cover the seven Nolan principles.</p>
        </div>
        <dl class="snapshot" id="snapshot" aria-label="Snapshot"></dl>
      </header>

      <section class="panel scope-panel" aria-label="Scope">
        <div class="panel-head">
          <h2>Scope of the register</h2>
          <p class="hint" id="scope-hint"></p>
        </div>
        <div id="scope-spectrum" class="scope-spectrum"></div>
        <div id="scope-legend" class="scope-legend"></div>
      </section>

      <section class="controls" aria-label="Filters">
        <div class="ctl grow">
          <label for="search">Search</label>
          <input id="search" type="search" placeholder="Organisation, category, classification…" autocomplete="off" />
        </div>
        <div class="ctl">
          <label for="f-scope">Scope</label>
          <select id="f-scope"></select>
        </div>
        <div class="ctl">
          <label for="f-class">Classification</label>
          <select id="f-class"></select>
        </div>
        <div class="ctl">
          <label for="f-cat">Category</label>
          <select id="f-cat"></select>
        </div>
        <span class="result-count" id="result-count" aria-live="polite"></span>
      </section>

      <section class="grid">
        <div class="table-wrap panel">
          <div class="panel-head">
            <h2>Organisations</h2>
            <span class="legend" id="nolan-legend"></span>
          </div>
          <div class="table-scroll">
            <table class="orgtable" id="orgtable">
              <thead id="orgtable-head"></thead>
              <tbody id="orgtable-body"></tbody>
            </table>
          </div>
          <p class="hint" id="table-hint"></p>
        </div>
        <aside class="detail panel" id="detail" aria-live="polite"></aside>
      </section>

      <section class="lower-grid">
        <div class="panel">
          <div class="panel-head"><h2>By classification</h2></div>
          <div id="facet-class" class="facet-list"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>By category</h2></div>
          <div id="facet-cat" class="facet-list"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h2>Nolan coverage</h2>
            <span class="panel-tag amber" id="nolan-strip-tag">coded exemplars</span>
          </div>
          <div id="principle-strip" class="strip-rows"></div>
        </div>
      </section>

      <p class="foot" id="foot"></p>
    </main>
    <script src="./data-source.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
